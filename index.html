<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f8f6">
  <meta name="description" content="A simple study task planner.">
  <title>Study Planner</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="layout">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Study Planner home">study<span>.</span></a>
      <span class="local-note"><span class="save-dot" aria-hidden="true"></span> Saved on this device</span>
    </header>

    <section class="planner" aria-labelledby="page-title">
      <div class="heading-row">
        <div>
          <p class="eyebrow" id="today-label">STUDY PLANNER</p>
          <h1 id="page-title">Your tasks</h1>
        </div>
        <p class="remaining" aria-live="polite"><strong id="remaining-count">0</strong> remaining</p>
      </div>

      <form class="task-form" id="task-form" novalidate>
        <label class="visually-hidden" for="task-title">Task name</label>
        <input id="task-title" name="title" type="text" maxlength="120" placeholder="Add a task..." autocomplete="off" required>
        <label class="visually-hidden" for="task-course">Subject or course (optional)</label>
        <input id="task-course" name="course" type="text" maxlength="60" placeholder="Subject or course" autocomplete="off">
        <button type="submit" class="add-button">Add task</button>
        <p class="form-error" id="form-error" role="alert" hidden>Enter a task name first.</p>
      </form>

      <nav class="filters" aria-label="Filter tasks">
        <div class="filter-buttons" role="group" aria-label="Task status">
          <button type="button" class="filter-button is-active" data-filter="all" aria-pressed="true">All <span id="all-count">0</span></button>
          <button type="button" class="filter-button" data-filter="active" aria-pressed="false">To do</button>
          <button type="button" class="filter-button" data-filter="completed" aria-pressed="false">Completed</button>
        </div>
        <button type="button" class="clear-button" id="clear-completed" hidden>Clear completed</button>
      </nav>

      <ul class="task-list" id="task-list" aria-label="Study tasks"></ul>
      <div class="empty-state" id="empty-state">
        <p class="empty-title" id="empty-title">Nothing here yet</p>
        <p class="empty-copy" id="empty-copy">Add a task to get started.</p>
      </div>
    </section>
    <footer class="footer">A little progress adds up.</footer>
  </main>
</body>
</html>
